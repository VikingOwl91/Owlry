[package]
name = "owlry"
version = "2.0.1"
edition = "2024"
rust-version = "1.90"
description = "A lightweight, owl-themed application launcher for Wayland"
authors = ["Owlibou"]
license = "GPL-3.0-or-later"
repository = "https://somegit.dev/Owlibou/owlry"
keywords = ["launcher", "wayland", "gtk4", "linux"]
categories = ["gui"]

[lib]
name = "owlry"
path = "src/lib.rs"

[[bin]]
name = "owlry"
path = "src/main.rs"

[dependencies]
# GTK4 for the UI
gtk4 = { version = "0.10", features = ["v4_12"] }

# Layer shell support for Wayland overlay behavior
gtk4-layer-shell = "0.7"

# Low-level syscalls for stdin detection (dmenu mode)
libc = "0.2"

# Logging & notifications
log = "0.4"
env_logger = "0.11"
notify-rust = "4"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Configuration & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Provider system & search
fuzzy-matcher = "0.3"
freedesktop-desktop-entry = "0.8"

# Data & filesystem
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

# Error handling
thiserror = "2"

# Signal handling (daemon)
signal-hook = "0.3"

# Built-in providers
expr-solver-lib = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "blocking"] }

# Async oneshot channel (background thread -> main loop)
futures-channel = "0.3"

# Lua 5.4 runtime for user configuration (Phase 3 — opt-in preview in 2.1).
# Vendored C source so AUR clean-chroot builds don't depend on a system Lua.
mlua = { version = "0.11", features = ["lua54", "vendored", "send", "serialize"], optional = true }

# Glob pattern support for `owlry.util.glob` (Phase 3.6). Pure-Rust; small.
glob = { version = "0.3", optional = true }

# Filesystem watching for owlry.lua hot reload (Phase 3.7). On Linux the
# inotify backend is unconditional, so default features are fine.
notify = { version = "6", optional = true }

[build-dependencies]
# GResource compilation for bundled icons
glib-build-tools = "0.20"

[dev-dependencies]
tempfile = "3"

[features]
default = ["systemd"]

# Enable verbose debug logging (for development/testing builds)
dev-logging = []

# Optional providers (compiled in when enabled).
# The AUR PKGBUILD builds with --features "full" to ship everything.
clipboard = []
emoji = []
filesearch = []
ssh = []
systemd = []
websearch = []

# Lua config layer (Phase 3 — opt-in preview in 2.1, default in 2.2, mandatory in 3.0).
# Pulls in mlua's vendored Lua 5.4 runtime, glob for owlry.util.glob, and
# notify for owlry.lua hot reload.
lua = ["dep:mlua", "dep:glob", "dep:notify"]

# Bookmarks deferred for 2.0 alongside the widget providers (D20+).
# Returns in a later 2.x release with a pure-Rust path that doesn't pull
# in libsqlite3-sys for Firefox's places.sqlite.

full = [
    "clipboard",
    "emoji",
    "filesearch",
    "lua",
    "ssh",
    "systemd",
    "websearch",
]
