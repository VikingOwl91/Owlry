[package]
name = "owlry"
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.90"
description = "A lightweight, owl-themed application launcher for Wayland"
authors = ["Owlibou"]
license = "GPL-3.0-or-later"
repository = "https://somegit.dev/Owlibou/owlry"
keywords = ["launcher", "wayland", "gtk4", "linux"]
categories = ["gui"]

[lib]
name = "owlry"
path = "src/lib.rs"

[[bin]]
name = "owlry"
path = "src/main.rs"

[dependencies]
# GTK4 for the UI
gtk4 = { version = "0.10", features = ["v4_12"] }

# Layer shell support for Wayland overlay behavior
gtk4-layer-shell = "0.7"

# Low-level syscalls for stdin detection (dmenu mode)
libc = "0.2"

# Logging & notifications
log = "0.4"
env_logger = "0.11"
notify-rust = "4"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Configuration & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Provider system & search
fuzzy-matcher = "0.3"
freedesktop-desktop-entry = "0.8"

# Data & filesystem
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

# Error handling
thiserror = "2"

# Signal handling (daemon)
signal-hook = "0.3"

# Built-in providers
expr-solver-lib = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "blocking"] }

# Optional providers (gated by cargo features below)
rusqlite = { version = "0.39", features = ["bundled"], optional = true }

# Async oneshot channel (background thread -> main loop)
futures-channel = "0.3"

[build-dependencies]
# GResource compilation for bundled icons
glib-build-tools = "0.20"

[dev-dependencies]
tempfile = "3"

[features]
default = ["systemd"]

# Enable verbose debug logging (for development/testing builds)
dev-logging = []

# Optional providers (compiled in when enabled).
# The AUR PKGBUILD builds with --features "full" to ship everything.
bookmarks = ["dep:rusqlite"]
clipboard = []
emoji = []
filesearch = []
ssh = []
systemd = []
websearch = []

full = [
    "bookmarks",
    "clipboard",
    "emoji",
    "filesearch",
    "ssh",
    "systemd",
    "websearch",
]
