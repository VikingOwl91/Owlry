[package]
name = "owlry-core"
version = "1.3.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core daemon for the Owlry application launcher"

[lib]
name = "owlry_core"
path = "src/lib.rs"

[[bin]]
name = "owlryd"
path = "src/main.rs"

[dependencies]
owlry-plugin-api = { path = "../owlry-plugin-api" }

# Provider system
fuzzy-matcher = "0.3"
freedesktop-desktop-entry = "0.8"

# Plugin loading
libloading = "0.8"
semver = "1"

# Data & config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

# Error handling
thiserror = "2"

# Filesystem watching (plugin hot-reload)
notify = "7"
notify-debouncer-mini = "0.5"

# Signal handling
signal-hook = "0.3"

# Logging & notifications
log = "0.4"
env_logger = "0.11"
notify-rust = "4"

# Built-in providers
expr-solver-lib = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "blocking"] }

# Optional: embedded Lua runtime
mlua = { version = "0.11", features = ["lua54", "vendored", "send", "serialize"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
lua = ["dep:mlua"]
dev-logging = []
