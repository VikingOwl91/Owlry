# Owlry Configuration
# Copy to: ~/.config/owlry/config.toml
#
# File Locations (XDG Base Directory compliant):
# ┌─────────────────────────────────────────────────────────────────────┐
# │ Lua:     ~/.config/owlry/owlry.lua          Preferred config        │
# │ Config:  ~/.config/owlry/config.toml        TOML fallback           │
# │ Themes:  ~/.config/owlry/themes/*.css       Custom theme files      │
# │ Style:   ~/.config/owlry/style.css          CSS overrides           │
# │ Data:    ~/.local/share/owlry/frecency.json Usage history           │
# └─────────────────────────────────────────────────────────────────────┘
#

# ═══════════════════════════════════════════════════════════════════════
# DMENU MODE
# ═══════════════════════════════════════════════════════════════════════
#
# Dmenu mode provides interactive selection from piped input.
# The selected item is printed to stdout (not executed), so pipe
# the output to execute it:
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │ # Screenshot menu                                                   │
# │ printf '%s\n' \                                                     │
# │   "grimblast --notify copy screen" \                                │
# │   "grimblast --notify copy area" \                                  │
# │   | owlry -m dmenu -p "Screenshot" \                                │
# │   | sh                                                              │
# │                                                                     │
# │ # Git branch checkout                                               │
# │ git branch | owlry -m dmenu -p "checkout" | xargs git checkout      │
# │                                                                     │
# │ # Package search                                                    │
# │ pacman -Ssq | owlry -m dmenu -p "install" | xargs sudo pacman -S    │
# └─────────────────────────────────────────────────────────────────────┘

# ═══════════════════════════════════════════════════════════════════════
# GENERAL
# ═══════════════════════════════════════════════════════════════════════

[general]
show_icons = true
max_results = 100

# Terminal emulator for SSH, scripts, etc.
# Auto-detection order: $TERMINAL → xdg-terminal-exec → DE-native → Wayland
# terminals → X11 terminals → x-terminal-emulator → xterm
# Uncomment to override:
# terminal_command = "kitty"

# Enable uwsm (Universal Wayland Session Manager) for launching apps.
# When enabled, apps are launched via "uwsm app --" which starts them
# in a proper systemd user session for better process management.
# Requires: uwsm to be installed
# use_uwsm = true

# Header tabs — provider tabs shown in the UI bar (Ctrl+1..9 to toggle)
# Core values: app, cmd, dmenu
# Optional provider ids: uuctl, calc, clip, emoji, rofimoji, file, ssh, power, web
tabs = ["app", "cmd", "uuctl"]

# ═══════════════════════════════════════════════════════════════════════
# APPEARANCE
# ═══════════════════════════════════════════════════════════════════════

[appearance]
width = 850
height = 650
font_size = 14
border_radius = 12

# Theme name - loads ~/.config/owlry/themes/{name}.css
# Built-in: owl
# Or leave unset/empty for GTK default
# theme = "owl"

# Color overrides (applied on top of theme)
# [appearance.colors]
# background = "#1a1b26"
# background_secondary = "#24283b"
# border = "#414868"
# text = "#c0caf5"
# text_secondary = "#565f89"
# accent = "#7aa2f7"
# accent_bright = "#89b4fa"
#
# Provider badge colors (optional)
# badge_app = "#7aa2f7"
# badge_cmd = "#9ece6a"
# badge_calc = "#bb9af7"
# badge_clip = "#7dcfff"
# badge_dmenu = "#c0caf5"
# badge_emoji = "#f7768e"
# badge_file = "#73daca"
# badge_ssh = "#2ac3de"
# badge_power = "#f7768e"     # alias: badge_sys
# badge_uuctl = "#9ece6a"
# badge_web = "#7aa2f7"

# ═══════════════════════════════════════════════════════════════════════
# PROVIDERS
# ═══════════════════════════════════════════════════════════════════════
#
# Provider availability is a compile-time cargo feature. The AUR package and
# builds with --features full include every optional provider. [providers]
# controls runtime enablement; a provider that is not compiled in produces no
# results even when enabled here.

[providers]
# Core providers (always compiled)
applications = true      # .desktop applications from XDG dirs
commands = true          # Executables from $PATH
calculator = true        # Math expressions (= or :calc)
converter = true         # Unit/currency conversion (> or :conv)
power = true             # Power actions: shutdown, reboot, lock, etc. (alias: system)

# Optional providers (require the matching cargo feature)
clipboard = true         # Clipboard history via cliphist
emoji = true             # Emoji picker via wl-clipboard
rofimoji = true          # Emoji + kaomoji picker via rofimoji
ssh = true               # ~/.ssh/config hosts
systemd = true           # systemd user units (:uuctl)
websearch = true         # Web search
filesearch = true        # Filesystem search via fd or locate

# Frecency — boost frequently/recently used items
# Data stored in: ~/.local/share/owlry/frecency.json
frecency = true
frecency_weight = 0.3    # 0.0 = disabled, 1.0 = strong boost
frecency_max_entries = 5000     # cap retained entries (0 = unbounded)
frecency_max_age_days = 180     # drop entries older than this (0 = no age pruning)
frecency_min_launches = 3       # launches that exempt an old entry from age pruning

# Web search engine (used by the web search provider)
# Options: google, duckduckgo, bing, startpage, searxng, brave, ecosia
# Or a custom URL: "https://search.example.com/?q={query}"
search_engine = "duckduckgo"

# Root directories for file search (the :file prefix or the / alias). "~/" is
# expanded; non-existent entries are dropped. Empty (default) searches $HOME.
# File search is opt-in — it never runs on a bare query, only under :file / /.
# filesearch_roots = ["~/Documents", "~/code"]
