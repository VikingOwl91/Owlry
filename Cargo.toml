[workspace]
resolver = "2"
members = [
    "crates/owlry",
    "crates/owlry-core",
]

# Shared workspace settings
[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://somegit.dev/Owlibou/owlry"

# Release profile (shared across all crates)
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.dev]
opt-level = 0
debug = true

# For installing a testable build: cargo install --path crates/owlry --profile dev-install --features dev-logging
[profile.dev-install]
inherits = "release"
strip = false
debug = 1
